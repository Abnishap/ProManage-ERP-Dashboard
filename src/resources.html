<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProManage - Resources</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo.svg" alt="Logo" class="sidebar-logo">
        <h5>ProManage</h5>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="inventory.html">
            <i class="fas fa-boxes"></i> Inventory
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="projects.html">
            <i class="fas fa-project-diagram"></i> Projects
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="resources.html">
            <i class="fas fa-users"></i> Resources
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reports.html">
            <i class="fas fa-chart-bar"></i> Reports
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="tasks.html">
            <i class="fas fa-tasks"></i> Tasks
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content flex-grow-1">
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary d-md-none" id="sidebarToggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="d-flex align-items-center">
            <img src="assets/profile.svg" alt="Profile" class="profile-img me-2">
            <span>Welcome, Abnisha Paudel</span>
          </div>
          <div class="d-flex">
            <button class="btn btn-outline-secondary" id="notificationsBtn" title="Notifications">
              <i class="fas fa-bell"></i>
            </button>
          </div>
        </div>
      </nav>

      <!-- Page Content -->
      <div class="container-fluid mt-4">
        <div class="row">
          <div class="col-md-8">
            <h2>Resource Scheduling</h2>
            <div class="card">
              <div class="card-header">
                <h5>Calendar View</h5>
              </div>
              <div class="card-body">
                <div id="calendar">
                  <!-- Simple calendar representation -->
                  <div class="calendar-header d-flex justify-content-between align-items-center">
                    <button class="btn btn-sm btn-outline-primary calendar-nav-btn" id="prevMonth">
                      <i class="fas fa-chevron-left"></i>
                    </button>
                    <h6 id="currentMonth">May 2026</h6>
                    <button class="btn btn-sm btn-outline-primary calendar-nav-btn" id="nextMonth">
                      <i class="fas fa-chevron-right"></i>
                    </button>
                  </div>
                  <div class="calendar-grid">
                    <div class="calendar-day header">Sun</div>
                    <div class="calendar-day header">Mon</div>
                    <div class="calendar-day header">Tue</div>
                    <div class="calendar-day header">Wed</div>
                    <div class="calendar-day header">Thu</div>
                    <div class="calendar-day header">Fri</div>
                    <div class="calendar-day header">Sat</div>
                    <!-- Days will be populated by JS -->
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <h3>Team Availability</h3>
            <div class="card">
              <div class="card-body">
                <div id="teamAvailability">
                  <!-- Team members availability -->
                </div>
              </div>
            </div>
            <h3 class="mt-4">Upcoming Meetings</h3>
            <div class="card">
              <div class="card-body">
                <div id="meetingsList">
                  <!-- Meetings list -->
                </div>
                <button class="btn btn-primary mt-3" id="scheduleMeetingBtn">
                  <i class="fas fa-plus"></i> Schedule Meeting
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/mockData.js"></script>
  <script src="js/app.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
