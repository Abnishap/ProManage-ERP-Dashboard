<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProManage - Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo.svg" alt="Logo" class="sidebar-logo">
        <h5>ProManage</h5>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="inventory.html">
            <i class="fas fa-boxes"></i> Inventory
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="projects.html">
            <i class="fas fa-project-diagram"></i> Projects
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="resources.html">
            <i class="fas fa-users"></i> Resources
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reports.html">
            <i class="fas fa-chart-bar"></i> Reports
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="tasks.html">
            <i class="fas fa-tasks"></i> Tasks
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content flex-grow-1">
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary d-md-none" id="sidebarToggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="d-flex align-items-center">
            <img src="assets/profile.svg" alt="Profile" class="profile-img me-2">
            <span>Welcome, Abnisha Paudel</span>
          </div>
          <div class="d-flex">
            <button class="btn btn-outline-secondary" id="notificationsBtn" title="Notifications">
              <i class="fas fa-bell"></i>
            </button>
          </div>
        </div>
      </nav>

      <!-- Page Content -->
      <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Inventory Management</h2>
          <button class="btn btn-primary" id="addInventoryBtn" data-bs-toggle="modal" data-bs-target="#addInventoryModal">
            <i class="fas fa-plus"></i> Add Item
          </button>
        </div>

        <!-- Filters -->
        <div class="row mb-4">
          <div class="col-md-4">
            <input type="text" class="form-control" id="searchInventory" placeholder="Search inventory...">
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filterCategory">
              <option value="">All Categories</option>
              <option value="Raw Materials">Raw Materials</option>
              <option value="Components">Components</option>
              <option value="Finished Goods">Finished Goods</option>
              <option value="Supplies">Supplies</option>
              <option value="Equipment">Equipment</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary" id="clearFilters">Clear</button>
          </div>
        </div>

        <!-- Inventory Table -->
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped" id="inventoryTable">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Item Name</th>
                    <th>Category</th>
                    <th>Stock</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="inventoryTableBody">
                  <!-- Inventory items will be loaded here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Inventory Modal -->
  <div class="modal fade" id="addInventoryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Inventory Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addInventoryForm">
            <div class="mb-3">
              <label for="itemName" class="form-label">Item Name</label>
              <input type="text" class="form-control" id="itemName" required>
            </div>
            <div class="mb-3">
              <label for="itemCategory" class="form-label">Category</label>
              <select class="form-select" id="itemCategory" required>
                <option value="Raw Materials">Raw Materials</option>
                <option value="Components">Components</option>
                <option value="Finished Goods">Finished Goods</option>
                <option value="Supplies">Supplies</option>
                <option value="Equipment">Equipment</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="itemStock" class="form-label">Stock Quantity</label>
              <input type="number" class="form-control" id="itemStock" required>
            </div>
            <div class="mb-3">
              <label for="itemLocation" class="form-label">Location</label>
              <input type="text" class="form-control" id="itemLocation" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveInventoryBtn">Save Item</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/mockData.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
