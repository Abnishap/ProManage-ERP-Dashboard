<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProManage - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo.svg" alt="Logo" class="sidebar-logo">
        <h5>ProManage</h5>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="inventory.html">
            <i class="fas fa-boxes"></i> Inventory
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="projects.html">
            <i class="fas fa-project-diagram"></i> Projects
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="resources.html">
            <i class="fas fa-users"></i> Resources
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reports.html">
            <i class="fas fa-chart-bar"></i> Reports
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="tasks.html">
            <i class="fas fa-tasks"></i> Tasks
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content flex-grow-1">
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary d-md-none" id="sidebarToggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="d-flex align-items-center">
            <img src="assets/profile.svg" alt="Profile" class="profile-img me-2">
            <span>Welcome, Abnisha Paudel</span>
          </div>
          <div class="d-flex">
            <button class="btn btn-outline-secondary" id="notificationsBtn" title="Notifications">
              <i class="fas fa-bell"></i>
            </button>
          </div>
        </div>
      </nav>

      <!-- Page Content -->
      <div class="container-fluid mt-4">
        <div id="pageContent">
          <!-- Dashboard content will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="data/mockData.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
